# Copy to config/models/my-model.toml, or use `uv run llm-init --backend script`.
# For vLLM, use backend = "vllm" instead (see examples/vllm-model.toml).
[model]
name = "My model with a custom engine"
alias = "my-model"
backend = "script"
repo = "ORG/MODEL_REPOSITORY" # Replace with a model supported by your engine.

[scripts]
serve = "examples/backends/custom.sh"
# prepare = "scripts/models/prepare-my-model.sh"

[server]
context_size = 8192
max_output = 2048
parallel = 1
# Engine-specific flags, passed to the serve script as positional arguments.
extra_args = []

[slurm]
gpus = 1
cpus_per_task = 8
mem = "64G"
time = "08:00:00"

[capabilities]
# Enable only after checking your model, chat template, and runtime.
tools = false
responses = false
