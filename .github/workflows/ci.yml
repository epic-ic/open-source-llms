name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/prepare.sh slurm/serve.sbatch examples/backends/vllm.sh
      - run: llm list
