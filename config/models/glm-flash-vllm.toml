# GLM-5.3-Flash (320B MoE, 18B active) served by vLLM from NVIDIA's NVFP4 checkpoint.
# The weights are ~190 GiB: with 48 GB GPUs this needs all 8 GPUs of one node.
# NVFP4 requires Blackwell GPUs. NVIDIA validated it on GB200; RTX PRO (sm_120)
# runs through vLLM's sm_120 kernels.
[model]
name = "GLM-5.3-Flash NVFP4 (vLLM)"
alias = "glm-5.3-flash"
backend = "vllm"

[download]
repo = "nvidia/GLM-5.3-Flash-NVFP4"
revision = "main" # Use a commit ID to make downloads reproducible.
directory = "models/GLM-5.3-Flash-NVFP4"

[server]
port = 8001
context_size = 262144 # per request; the checkpoint supports up to 1M with more KV memory
parallel = 8
max_output = 32768
# Sampling from the checkpoint's generation_config.json; requests may override it.
temperature = 1.0
top_p = 0.95
# Load the 33 shards with parallel reads (8 ranks x 16 threads) and skip experts other ranks own.
extra_args = [
  "--enable-ep-weight-filter",
  "--model-loader-extra-config",
  '{"enable_multithread_load":true,"num_threads":16}',
]

[vllm]
tensor_parallel_size = 8
enable_expert_parallel = true
gpu_memory_utilization = 0.92
# sm_120 sparse MLA (FLASHINFER_MLA_SPARSE_SM120) only supports the packed fp8 layout.
kv_cache_dtype = "fp8"
max_num_batched_tokens = 8192
enable_prefix_caching = true
# Text-only serving: skip the vision tower and give its memory to the KV cache.
language_model_only = true
# Thinking is always on; reasoning_effort selects low, high, or max (default).
reasoning_parser = "glm47"
tool_call_parser = "glm47"
# The checkpoint ships an MTP draft layer; enable after a first successful run.
# speculative_config = { method = "mtp", num_speculative_tokens = 3 }

[slurm]
gpus = 8
cpus_per_task = 64
mem = "256G"
gpu_type = "nvidia_rtx_pro_5000_blackwell"
time = "5-00:00:00"

[capabilities]
tools = true
responses = true
reasoning_efforts = ["low", "high", "max"]
