# vLLM is installed by `uv run llm-prepare` for backend = "vllm" profiles into
# .tools/vllm/VERSION, a uv virtual environment on shared storage.
[vllm]
version = "0.30.0"
python = "3.12"
# Extra requirements installed alongside vLLM, e.g. ["transformers>=5.8"].
packages = []
